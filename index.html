
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #fff;
            color: #333;
            margin: 30px;
        }
        .cabecalho {
            text-align: center;
            margin-bottom: 40px;
        }
        .cabecalho h1 {
            font-size: 28px;
            color: #003366;
            margin: 0;
        }
        .cabecalho p {
            font-size: 14px;
            color: #555;
            margin: 4px;
        }
        .abas {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }
        .abas button {
            padding: 10px 20px;
            background-color: #004080;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .abas button:hover {
            background-color: #0059b3;
        }
        .conteudo {
            display: none;
        }
        .ativo {
            display: block;
        }
    </style>

    <script>
        function mostrarAba(id) {
            let seções = document.getElementsByClassName('conteudo');
            for (let i = 0; i < seções.length; i++) {
                seções[i].classList.remove('ativo');
            }
            document.getElementById(id).classList.add('ativo');
        }
    </script>
